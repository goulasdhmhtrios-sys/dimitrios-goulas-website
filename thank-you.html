<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ευχαριστούμε | Δημήτριος Χ. Γούλας</title>
  <style>
    :root {
      --primary: #0b3476;
      --primary-dark: #08275a;
      --bg: #f8fafc;
      --white: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top right, #dbeafe, transparent 35%), radial-gradient(circle at bottom left, #ccfbf1, transparent 35%), var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    .card {
      width: min(680px, 100%);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 32px;
      box-shadow: var(--shadow);
      padding: 42px;
      text-align: center;
    }

    .badge {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #e0f2fe;
      color: var(--primary);
      font-size: 36px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.12;
      letter-spacing: -0.04em;
      margin-bottom: 14px;
    }

    p {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      text-decoration: none;
    }

    a:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">✓</div>
    <h1>Το αίτημά σας εστάλη</h1>
    <p>Ευχαριστούμε για την επικοινωνία. Το ιατρείο θα επικοινωνήσει μαζί σας το συντομότερο δυνατό για την επιβεβαίωση του ραντεβού.</p>
    <a href="index.html">Επιστροφή στην αρχική σελίδα</a>
  </main>
</body>
</html>
